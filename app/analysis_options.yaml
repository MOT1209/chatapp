include: package:flutter_lints/flutter.yaml

formatter:
  page_width: 120

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    - prefer_final_locals
    - prefer_single_quotes
    - unawaited_futures
    - always_declare_return_types
    - avoid_dynamic_calls
    - cancel_subscriptions
    - close_sinks
