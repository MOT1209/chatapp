<!doctype html>
<html lang="ar" dir="rtl" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0f19" media="(prefers-color-scheme: dark)" />
    <title>الدردشة</title>
    <script>
      // Applies the stored theme before first paint so the app never flashes the wrong colours.
      (function () {
        try {
          var stored = localStorage.getItem("chatapp.theme");
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (stored === "dark" || (stored !== "light" && prefersDark)) {
            document.documentElement.classList.add("dark");
          }
        } catch (error) {
          // localStorage can be blocked in private mode. The light theme is a fine fallback.
        }
      })();
    </script>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
