version: 2
updates:
  # Keeps the actions in .github/workflows current, including SHA-pinned ones
  # (Dependabot bumps the SHA and the trailing "# vX.Y.Z" comment together).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    # One PR per week for all action bumps instead of one per action.
    groups:
      github-actions:
        patterns:
          - '*'
    commit-message:
      prefix: ci
