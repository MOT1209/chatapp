name: app

# No `paths:` filter on `ci` (audit F-26): a path-filtered workflow reports no
# status for a PR that does not touch its paths, which makes it unusable as a
# required status check. Format/analyze/test is cheap, so it always runs.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: app-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FLUTTER_VERSION: 3.47.5

jobs:
  # The release-validation scripts (URL validator, artifact validator) are plain
  # Node with no dependencies: their tests run anywhere, on every app/scripts PR.
  release-tooling:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Test release validation scripts
        run: node --test scripts/validate-release-urls.test.mjs scripts/validate-artifacts.test.mjs

  ci:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install
        run: flutter pub get
      - name: Format
        run: dart format --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build web
        # --no-web-resources-cdn bundles CanvasKit and the fonts instead of fetching them from
        # gstatic.com at runtime, so the app makes no third-party requests (users' IPs are not
        # sent to Google) and also works on a restricted network. CI builds what is shipped.
        run: flutter build web --release --no-web-resources-cdn

  # Proves each platform still compiles. Deliberately NOT gated on `needs: ci`,
  # and deliberately not a required status check: the full matrix costs many
  # runner-minutes per PR and its only job is a compile check, so it runs on main
  # pushes and on manual dispatch only. Required protection lives on `ci` and
  # `release-tooling`, which both always report (see the note on `on:` above).
  build:
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-24.04
            command: flutter build apk --release
          - platform: linux
            os: ubuntu-24.04
            command: flutter build linux --release
          - platform: windows
            os: windows-2025
            command: flutter build windows --release
          - platform: macos
            os: macos-15
            command: flutter build macos --release
          # iOS (`flutter build ios --release --no-codesign`) is deferred until after Alpha.
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - if: matrix.platform == 'android'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - if: matrix.platform == 'linux'
        name: Install Linux toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev libjsoncpp-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install
        run: flutter pub get
      - name: Build
        run: ${{ matrix.command }}
